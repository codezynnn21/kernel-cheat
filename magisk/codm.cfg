# CODM overlay config — lives at /data/adb/codm/codm.cfg
# key=value, '#' comments, reload with the "Reload cfg" button or
#   su -c 'sh /data/adb/modules/codm_overlay/codm.sh restart'
#
# Mapping below is resolved against dump(GR .59).cs (MXFXKZY dump,
# 2026-11-05). Class and field offsets are read through il2cpp reflection by
# name, so a game update only breaks this when a class/field is renamed.
# Verify with:  menu -> "Dump il2cpp"

# ---- ESP ---------------------------------------------------------------------
esp.enable       = 1
esp.box          = 1
esp.health       = 1
esp.distance     = 1
esp.max_dist     = 400
esp.menu         = 1
esp.head_offset  = 1.75

# skip pawns on the local player's camp (m_AttackableInfo.m_Camp)
esp.enemy_only   = 1

# box_color.r/g/b/a 0..1
esp.box_color.0  = 1.0
esp.box_color.1  = 0.15
esp.box_color.2  = 0.15
esp.box_color.3  = 1.0

esp.text_color.0 = 1.0
esp.text_color.1 = 1.0
esp.text_color.2 = 1.0
esp.text_color.3 = 1.0

# ---- il2cpp mapping ----------------------------------------------------------
# image      assembly holding the game classes (Assembly-CSharp.dll)
# game_class namespace-qualified static holder; game_field is the static
#            BaseGame reference, re-read every frame (null between matches)
# root_class BaseGame; il2cpp.list is its instance field holding List<Pawn>
#            (declared as System.Collections.Generic.PawnList : List<Pawn>)
# class      the pawn class; pos/hp/hpmax/team/alive are field paths on it.
#            A dot walks into a struct field, e.g. m_AttackableInfo.m_Health
# pos_mode   transform = pos is a UnityEngine.Transform, position via
#            Transform.get_position; field = pos is a Vector3 field
il2cpp.image      = Assembly-CSharp.dll
il2cpp.game_class = GameEngine.GamePlay
il2cpp.game_field = s_Game
il2cpp.root_class = GameBase.BaseGame
il2cpp.list       = AllPawns
il2cpp.class      = GameBase.Pawn
il2cpp.pos_mode   = transform
il2cpp.pos        = m_Transform
il2cpp.hp         = m_AttackableInfo.m_Health
il2cpp.hpmax      = m_AttackableInfo.m_MaxHealth
il2cpp.team       = m_AttackableInfo.m_Camp
il2cpp.alive      = m_IsAlive

# resolved absolute offsets for sanity (relative name lookup wins):
#   m_Transform             0x20   (GameEngine.BaseObject)
#   m_CachedPosition        0x30   (GameEngine.BaseObject, Vector3)
#   m_AttackableInfo        0x78   (GameEngine.AttackableTarget)
#     m_Health              0x34 -> 0xAC float
#     m_MaxHealth           0x38 -> 0xB0 float
#     m_Camp                0x58 -> 0xD0 int
#   m_IsAlive               0x550  (GameBase.Pawn, bool)

# ---- skin id -----------------------------------------------------------------
# There is NO player-outfit id on the pawn classes. Character appearance is a
# server-sent proto (msg.RoleAppearance: EquippedItem suit/hat/clothes/wing) and
# is composed client-side by GameEngine.AvatarComposer from asset lists, so a
# single field write cannot swap an operator skin.
# What IS a plain field write, client-side visual only:
#   GameBase.Weapon.GlobalSkinID            0xA8  int
#   GameBase.Weapon.m_SkinID_MainWeaponRoot 0x970 int
#   GameBase.Weapon.m_SkinID_Sight/Sto/...  0x938+ int[]
#   GameEngine.SwitchRoleComponent.m_InitAvatarID_3P  0x88 int (3P model id)
# Point il2cpp.skin at whatever id you want drawn under the box; a pawn-class
# field path like m_AttackableInfo.m_ActorID gives a stable per-pawn id.
il2cpp.skin      = m_AttackableInfo.m_ActorID
il2cpp.skin_off  =

# draw the id under the box; filter is a comma list of ids, empty = all
esp.skin         = 1
esp.skin_filter  =

# client-side override on the local pawn. set_rva = 0 writes the field named by
# il2cpp.skin; set_rva calls a dump RVA with (pawn, id) instead.
skin.set         = 0
skin.set_id      = 0
skin.set_rva     = 0

# ---- aim (stub: reads config, not wired to touch injection yet) --------------
aim.enable       = 0
aim.fov          = 120
aim.smooth       = 8
aim.bone         = 0

# ---- stealth / detection surface ---------------------------------------------
# Userspace only. Hides the payload from dl_iterate_phdr and from the usual
# fopen/open text scan of /proc/self/maps|smaps, and unlinks the staged .so
# after the loader maps it. A raw syscall read of maps, /proc/self/map_files,
# or a kernel-side scanner still sees the mapping — see README "stealth layer".
#
# quiet=1 suppresses logcat from both the payload and the injector; the
# injector.log file under /data/adb/codm keeps writing.
# hide_proc renames the root daemon's comm/argv (ps, top) and calls setsid().
# precheck skips eglSwapBuffers/input hooks when another hook already owns the
# prologue, instead of stacking trampolines on top of it.
stealth.enable      = 1
stealth.hide_dl     = 1
stealth.hide_maps   = 1
stealth.unlink_self = 1
stealth.quiet       = 0
stealth.precheck    = 1
stealth.hide_proc   = 1

# comma list of substrings; a /proc line or dlpi_name containing any of them is
# dropped. keep the payload's own basename here if you rename libcodm.so.
stealth.hide        = libcodm,codm_overlay,/data/adb/codm
stealth.proc_name   = kworker/u16:2
